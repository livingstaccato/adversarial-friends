name = "claude"
binary = "claude"
base_argv = ["--print", "--output-format", "json"]
prompt_mode = "trailing-arg"
readonly_argv = ["--tools", "Read,Grep,Glob"]
schema_flag = "--json-schema"
# --json-schema takes the schema JSON itself, not a path. Passed a path,
# claude fails before the model sees anything:
#   Error: --json-schema is not valid JSON: JSON Parse error: Unrecognized token '/'
# Found by a crossexam that produced zero verdicts. claude had never once
# produced output under a schema -- the third of three native-schema
# adapters shipped this way, after codex and agy in 0.1.1.
schema_inline = true
model_flag = "--model"
internal_timeout_flag = ""
effort_kind = "native"
# Authority evidence captured from installed Claude Code 2.1.251 on
# 2026-08-30. `claude --help` documents: `--safe-mode` disables skills,
# plugins, hooks, MCP servers and other customizations; `--restricted`
# ignores user/project/local settings; `--strict-mcp-config` skips inherited
# MCP servers; `--tools ""` disables built-in tools; `--disable-slash-commands`
# disables skills; and `--no-chrome` disables the browser integration. The
# combined option-position invocation ending in `--help` parses successfully.
external_tools = "deny-argv"
deny_external_tools_argv = [
  "--safe-mode",
  "--restricted",
  "--strict-mcp-config",
  "--tools",
  "",
  "--disable-slash-commands",
  "--no-chrome",
]
deny_external_tools_probe_argv = [
  "--safe-mode",
  "--restricted",
  "--strict-mcp-config",
  "--tools",
  "",
  "--disable-slash-commands",
  "--no-chrome",
  "--help",
]
deny_external_tools_probe_markers = ["--safe-mode", "--restricted", "--strict-mcp-config"]
external_tool_sources = ["built-in tools", "skills", "plugins", "MCP servers", "Chrome integration"]
# --output-format json wraps the answer in claude's own envelope. Captured
# from claude 2.1.240 on 2026-08-23: a single JSON object with
# type="result", subtype="success", and the model's answer in `result` as a
# JSON-escaped string, alongside session_id/usage/total_cost_usd.
structured_output = true

# Under --json-schema the validated object is `structured_output`; `result`
# holds the same thing serialized as a STRING, and is where prose lands
# when the model does not manage structured output at all.
[envelope]
kind = "json_path"
path = "structured_output"

[effort]
low = ["--effort", "low"]
medium = ["--effort", "medium"]
high = ["--effort", "high"]
xhigh = ["--effort", "xhigh"]
max = ["--effort", "max"]

# §14 auth marker, captured 2026-08-28 from a real failure. Provoked without
# touching credentials at all: claude keeps them in the macOS Keychain, so
# running it under this runner's own sandbox WITHOUT a ~/Library/Keychains
# grant makes it unable to read them. Nothing is logged out and nothing is
# written -- read access is denied for one child process, and the operator's
# session is unaffected. (Copying credentials somewhere else, the obvious
# first idea, cannot work here: there is no file to copy, and a copy would
# authenticate rather than fail.)
#
# Under the adapter's real flags claude reports this as structured output
# rather than on stderr:
#
#   {"is_error":true,"terminal_reason":"api_error",
#    "result":"Not logged in · Please run /login", ...}
#
# A `paths` marker rather than a stderr substring, because this CLI states
# the failure in its own structured output -- the shape §14 prefers, and the
# same form opencode's marker takes.
#
# NOT the marker:
#   is_error / terminal_reason "api_error" -- set for every API failure,
#     including a rate limit and a 5xx. Matching either would classify a
#     transient outage as an auth failure and stop dispatching the friend.
#   api_error_status -- present in the object but null on this failure, so
#     there is no status code to key on.
#   exit 1 -- claude's exit code for any error.
#
# Exact equality is deliberate. If the wording changes, this stops matching
# and classification degrades to UNKNOWN, which is the safe direction:
# repeat detection still stops a friend that fails identically twice.
[auth]
remediation = "run `claude /login`; if the friend is OS-confined, its credentials are in the macOS Keychain and the sandbox cannot reach them"

[[auth.markers]]
path = "result"
equals = "Not logged in · Please run /login"
