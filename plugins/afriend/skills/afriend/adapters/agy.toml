# --print takes the prompt as its VALUE, so it must come last (verified trap).
name = "agy"
binary = "agy"
base_argv = ["--output-format", "json"]
prompt_mode = "flag-value"
prompt_flag = "--print"
# Installed agy 1.1.22 documents these invocation-local controls in
# `agy --help`. Keep every option here because --print consumes its next
# token as the prompt value and therefore must remain last.
readonly_argv = [
  "--agent", "afriend-reviewer",
  "--disable-slash-commands",
  "--mode", "plan",
  "--sandbox",
]
schema_flag = "--json-schema"
model_flag = "--model"
internal_timeout_flag = "--print-timeout"
effort_kind = "native"
structured_output = true
# Authority evidence captured from installed agy 1.1.22 on 2026-08-30:
# `agy --help` exposes MCP/plugin management subcommands, plan mode, and a
# slash-command switch, but no invocation-local option that disables inherited
# MCP servers, plugins, and tools together. It therefore remains fail-closed.
external_tools = "uncontrolled"
deny_external_tools_argv = []
external_tool_sources = ["tools", "slash commands", "MCP servers", "plugins"]

# Direct validation with installed agy 1.1.23 confirms that Markdown agents
# support `tools`, `subagent`, `disable-model-invocation`, and the single
# `inheritCustomizations` switch. `subagent: false` prevents subagent
# discovery/invocation; `disable-model-invocation: true` is a distinct
# restriction. These controls are defense in depth and do not prove
# invocation-local denial of every inherited tool/plugin/MCP source, so
# external_tools remains uncontrolled.
[[workspace_assets]]
source = "harnesses/agy/afriend-reviewer.md"
target = ".agents/agents/afriend-reviewer/agent.md"
sha256 = "947843c36fc8f9e3793a32dccb435037ff3be287d383b0a943f5965e493372ab"

[effort]
low = ["--effort", "low"]
medium = ["--effort", "medium"]
high = ["--effort", "high"]

# Captured directly from `agy --output-format json`: the answer is the
# top-level "response" string; on error, "response" is empty and "error"
# carries the message instead (see normalize.py's module docstring). A
# missing/empty "response" makes json_path unwrapping report "found
# nothing," so normalize() falls back to scanning the raw envelope, which
# still degrades cleanly (structured_output=true keeps that fallback's
# failure message legible).
[envelope]
kind = "json_path"
path = "response"
# Captured from a real run on 2026-08-26: {"status":"ERROR","response":"",
# "error":"timeout waiting for response",...}. Read only once normalizing
# has failed, so the failure reason leads with agy's own words instead of
# "the adapter may need an envelope path".
error_path = "error"

# Captured verbatim from a real failure: a crossexam run on 2026-08-26 whose
# agy login had lapsed. Exit status was 1 and stdout empty, so this sentence
# is the only place the failure is legible. The substring stops short of the
# trailing ", then retry." so a minor rewording of the tail cannot silently
# turn the marker off.
#
# NOT the marker: "Error: authentication timed out." -- that is what agy
# says when it cannot REACH the auth endpoint, and matching it would abort
# every network-denied run as an auth failure. See failures.py.
[auth]
stderr_contains = ["authentication required. Run 'agy' to log in"]
remediation = "run `agy` interactively to log in, then re-run"
