,263.8623,165" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#37474F;stroke-width:1;" x1="48.1245" x2="265.8623" y1="165" y2="165"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="62.3584" x="128.8142" y="138.4702">claim c-0001</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="105.6333" x="107.1768" y="149.4702">"the guard is missing"</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="107.2983" x="106.3442" y="160.4702">origin = [fake/security]</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" data-source-line="34" id="msg2"><polygon fill="#37474F" points="259.8623,208,269.8623,212,259.8623,216,263.8623,212" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#37474F;stroke-width:1;" x1="132.459" x2="265.8623" y1="212" y2="212"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="62.3584" x="170.9814" y="185.4702">claim c-0002</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="115.4033" x="144.459" y="196.4702">"The Guard Is  Missing"</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="87.1353" x="158.593" y="207.4702">origin = [fake/ops]</text></g><path d="M154,225 L154,271 L388,271 L388,235 L378,225 L154,225" fill="#FFF8E1" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M378,225 L378,235 L388,235 L378,225" fill="#FFF8E1" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="118.7227" x="160" y="239.2402">Dedup key normalizes</text><text fill="#000000" font-family="'Helvetica'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="24.668" x="282.0566" y="239.2402">only</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="60.0352" x="310.0586" y="239.2402">whitespace</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="204.7852" x="160" y="251.2402">runs and case, plus a strip on location.</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="213.4512" x="160" y="263.2402">Nothing else &#8212; deliberate under-merge.</text><g class="message" data-entity-1="part3" data-entity-2="part3" data-source-line="42" id="msg3"><line style="stroke:#37474F;stroke-width:1;" x1="271.8623" x2="313.8623" y1="304" y2="304"/><line style="stroke:#37474F;stroke-width:1;" x1="313.8623" x2="313.8623" y1="304" y2="317"/><line style="stroke:#37474F;stroke-width:1;" x1="272.8623" x2="313.8623" y1="317" y2="317"/><polygon fill="#37474F" points="282.8623,313,272.8623,317,282.8623,321,278.8623,317" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="69.6846" x="297.8303" y="288.4702">keys match &#8594;</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="107.6206" x="278.8623" y="299.4702">c-0002 aliases c-0001</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" data-source-line="43" id="msg4"><line style="stroke:#37474F;stroke-width:1;" x1="271.8623" x2="313.8623" y1="353" y2="353"/><line style="stroke:#37474F;stroke-width:1;" x1="313.8623" x2="313.8623" y1="353" y2="366"/><line style="stroke:#37474F;stroke-width:1;" x1="272.8623" x2="313.8623" y1="366" y2="366"/><polygon fill="#37474F" points="282.8623,362,272.8623,366,282.8623,370,278.8623,366" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="108.2222" x="282.5281" y="337.4702">c-0001.origin grows to</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="115.5537" x="278.8623" y="348.4702">[fake/security, fake/ops]</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" data-source-line="45" id="msg5"><polygon fill="#37474F" points="389.416,387,399.416,391,389.416,395,393.416,391" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#37474F;stroke-width:1;" x1="271.8623" x2="395.416" y1="391" y2="391"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="102.1206" x="285.5789" y="386.4702">append claim c-0001</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" data-source-line="46" id="msg6"><polygon fill="#37474F" points="389.416,423,399.416,427,389.416,431,393.416,427" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#37474F;stroke-width:1;" x1="271.8623" x2="395.416" y1="427" y2="427"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="102.1206" x="285.5789" y="411.4702">append claim c-0002</text><text fill="#000000" font-family="'Helvetica'" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="95.3262" x="288.9761" y="422.4702">(the duplicate too)</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" data-source-line="47" id="msg7"><polygon fill="#37474F" points="389.416,470,399.416,474,389.416,478,393.416,474" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#37474F;stroke-width:1;" x1="271.8623" x2="395.416" y1="474" y2="474"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="62.3853" x="305.4465" y="447.4702">append alias</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="86.5337" x="293.3723" y="458.4702">canonical=c-0001</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="84.0898" x="294.5942" y="469.4702">duplicate=c-0002</text></g><path d="M274,487 L274,545 L528,545 L528,497 L518,487 L274,487" fill="#FFF8E1" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M518,487 L518,497 L528,497 L518,487" fill="#FFF8E1" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="228.3809" x="280" y="501.2402">The duplicate's own claim record is written,</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="226.7871" x="280" y="513.2402">not just the alias. Otherwise alias.duplicate</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="233.502" x="280" y="525.2402">would dangle and a reader could not rebuild</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="190.7754" x="280" y="537.2402">corroboration from the ledger alone.</text><g class="message" data-entity-1="part3" data-entity-2="part5" data-source-line="56" id="msg8"><polygon fill="#37474F" points="473.01,563,483.01,567,473.01,571,477.01,567" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#37474F;stroke-width:1;" x1="271.8623" x2="479.01" y1="567" y2="567"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="93.5698" x="331.6512" y="562.4702">one finding, ranked</text></g><g class="message" data-entity-1="part5" data-entity-2="part5" data-source-line="57" id="msg9"><line style="stroke:#37474F;stroke-width:1;" x1="485.01" x2="527.01" y1="614" y2="614"/><line style="stroke:#37474F;stroke-width:1;" x1="527.01" x2="527.01" y1="614" y2="627"/><line style="stroke:#37474F;stroke-width:1;" x1="486.01" x2="527.01" y1="627" y2="627"/><polygon fill="#37474F" points="496.01,623,486.01,627,496.01,631,492.01,627" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="37.2969" x="538.4109" y="587.4702">renders</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="130.0986" x="492.01" y="598.4702">"corroborated by 2 friends"</text><text fill="#000000" font-family="'Helvetica'" font-size="11" lengthAdjust="spacing" textLength="112.4976" x="500.8105" y="609.4702">fake/security &#183; fake/ops</text></g><path d="M356,640 L356,698 L613,698 L613,650 L603,640 L356,640" fill="#E8F5E9" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M603,640 L603,650 L613,650 L603,640" fill="#E8F5E9" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="236.1445" x="362" y="654.2402">Two independent models reaching the same</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="198.1055" x="362" y="666.2402">conclusion is the strongest signal this</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="212.1094" x="362" y="678.2402">tool produces &#8212; so it is never collapsed</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="165.4277" x="362" y="690.2402">into a single unattributed claim.</text><?plantuml-src VLNBRXit5DtFLrme2oU6BLkA7Jj5Oa1EfQQ0bGAkTrLGS6QkHemeSafoD5M305tr0uh-I_Vvb7n93ZbwZ1orMWn4tWVlEUTUyeZUcfgaphbaVBIdAHPI5uvIpio2oMYcp5XhKcE5vvmo9UIYcnpHWnKPrg8GKZjFpcPdOcebyfmjs1RSBLVqb7yNcVyrhf-Hq3dYsewAyu8jFBj9ukPIbyAA1QKYcnVML3f_OvInz6GKVosFdAUYKdvaj7ydK6NdBQibUvc9pc6ld-KVJBtdBQERYTpKW4fJeHotB0EWhTSdFx-wkBeOFJRkClPQfWVf5UzCr-t3-BUATS