name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # act compat only (no-op on GitHub, where env.ACT is unset): act runs
      # a JS action's *post* step via a bare `docker exec` that does not
      # inherit the image's PATH, so `Post setup-uv`'s cache-save fails with
      # "node: executable file not found" and reports the whole job failed
      # after every real step has already passed. Symlinking node into a
      # default docker-exec PATH entry fixes the local signal. See
      # https://github.com/nektos/act/issues/107
      - name: act compat — expose node to docker exec
        if: ${{ env.ACT }}
        run: sudo ln -sf "$(command -v node)" /usr/local/bin/node

      # Checkout source
      - uses: actions/checkout@v7

      # Install uv and the matrix Python (uv manages its own interpreters,
      # so we don't need actions/setup-python).
      #
      # Pinned to a concrete tag rather than a moving major: astral-sh/setup-uv
      # publishes moving `vN` tags only through v7, so `@v8`/`@v9`/`@v10` do
      # not resolve at all ("reference not found") even though v10.0.1 is the
      # current release. Bump this deliberately; `make act-ci` catches a bad
      # ref before it reaches CI.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      # Install dependencies (this package has none at runtime; --all-extras
      # pulls the dev dependency group: pytest, mypy, ruff)
      - run: uv sync --all-extras

      # Lint and format check
      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

      # Type check
      - name: mypy
        run: uv run mypy src

      # Enforce 500-line per-file cap
      - name: max-loc
        run: make max-loc

      # Verify plugins/ matches the packaged assets/ mirror
      - name: plugin-sync
        run: make plugin-sync

      # Verify VERSION matches every plugin manifest's version field
      - name: version-sync
        run: make version-sync

      # Build the wheel and confirm every adapter, lens, and reference file
      # actually ships in it -- package-data misconfiguration is otherwise
      # silent until first run.
      - name: build wheel and verify assets
        run: ci/verify_wheel_assets.sh

      # Tests
      - name: pytest
        run: uv run pytest
