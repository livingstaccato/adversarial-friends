name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag version and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"

      - name: Extract and verify release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## ${version}" '
            $0 == heading { in_section = 1; next }
            in_section && /^## / { exit }
            in_section { print }
            END { if (!in_section) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          grep -Eq '[^[:space:]]' release-notes.md

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"

      - name: Build and verify six release artifacts
        run: ci/verify_release_distributions.sh dist

      # CI tests the checkout on this matrix too, but publishing must also
      # prove the exact canonical wheel imports and starts on every Python we
      # claim to support. The compatibility packages are pure metadata and
      # their exact resolution is verified by the prior release-artifact step.
      - name: Verify installed wheel on supported Python versions
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          wheel="dist/afriend-${version}-py3-none-any.whl"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "${smoke_dir}"' EXIT
          for python_version in 3.11 3.12 3.13; do
            uv python install "${python_version}"
            venv="${smoke_dir}/venv-${python_version}"
            uv venv --python "${python_version}" "${venv}"
            uv pip install --python "${venv}/bin/python" "${wheel}"
            test "$(cd /tmp && "${venv}/bin/afriend" --version)" = "afriend ${version}"
          done

      - name: Store release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/afriend
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Stage afriend distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish/afriend
          cp dist/afriend-* publish/afriend/

      - name: Publish afriend to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish/afriend/

      - name: Stage adversarial-friends distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish/adversarial-friends
          cp dist/adversarial_friends-* publish/adversarial-friends/

      - name: Publish adversarial-friends to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish/adversarial-friends/

      - name: Stage afriends distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish/afriends
          cp dist/afriends-* publish/afriends/

      - name: Publish afriends to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish/afriends/

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download published distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Extract release notes from the changelog
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## ${version}" '
            $0 == heading { in_section = 1; next }
            in_section && /^## / { exit }
            in_section { print }
            END { if (!in_section) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          grep -Eq '[^[:space:]]' release-notes.md

      - name: Create or repair the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "afriend ${version}" \
              --notes-file release-notes.md
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --verify-tag \
              --title "afriend ${version}" \
              --notes-file release-notes.md
          fi
