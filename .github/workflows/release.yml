name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag version and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"

      - name: Build wheel and source distribution
        run: uv build --wheel --sdist

      - name: Verify release distributions
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          wheel="dist/adversarial_friends-${version}-py3-none-any.whl"
          sdist="dist/adversarial_friends-${version}.tar.gz"
          test -f "${wheel}"
          test -f "${sdist}"
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 2
          uvx --from twine==7.0.0 twine check --strict dist/*

          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "${smoke_dir}"' EXIT
          uv venv "${smoke_dir}/venv"
          uv pip install --python "${smoke_dir}/venv/bin/python" "${wheel}"
          test "$("${smoke_dir}/venv/bin/afriend" --version)" = "afriend ${version}"

      - name: Store release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/adversarial-friends
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish release distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download published distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Extract release notes from the changelog
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## ${version}" '
            $0 == heading { in_section = 1; next }
            in_section && /^## / { exit }
            in_section { print }
            END { if (!in_section) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create or repair the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "Adversarial Friends ${version}" \
              --notes-file release-notes.md
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --verify-tag \
              --title "Adversarial Friends ${version}" \
              --notes-file release-notes.md
          fi
