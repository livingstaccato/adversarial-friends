name = "claude"
binary = "claude"
base_argv = ["--print", "--output-format", "json"]
prompt_mode = "trailing-arg"
readonly_argv = ["--tools", "Read,Grep,Glob"]
schema_flag = "--json-schema"
model_flag = "--model"
internal_timeout_flag = ""
effort_kind = "native"
# --output-format json wraps the answer in an envelope of claude's own; its
# real shape has not been captured (capturing it costs a metered call --
# see normalize.py's module docstring), so no [envelope] is declared. Do
# NOT invent one: structured_output=true alone is enough for normalize() to
# report an honest, actionable failure ("...may need an envelope path")
# instead of a silent/confusing "no findings" when this envelope's wrapper
# object is mistaken for the answer.
structured_output = true

[effort]
low = ["--effort", "low"]
medium = ["--effort", "medium"]
high = ["--effort", "high"]
xhigh = ["--effort", "xhigh"]
max = ["--effort", "max"]
