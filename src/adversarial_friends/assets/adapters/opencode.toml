# --variant accepts any string silently, so effort can never be verified.
name = "opencode"
binary = "opencode"
base_argv = ["run", "--format", "json"]
prompt_mode = "trailing-arg"
readonly_argv = []
schema_flag = ""
model_flag = "--model"
internal_timeout_flag = ""
effort_kind = "unverified"
structured_output = true

[effort]
low = ["--variant", "minimal"]
high = ["--variant", "high"]
max = ["--variant", "max"]

# `opencode run --format json` emits NDJSON (one event object per line).
# Only the "error" event's shape has actually been captured (see
# normalize.py's module docstring and tests/fixtures/opencode_error.ndjson);
# a success-carrying event type has not been observed, so no rule for it is
# declared here rather than guessing one. A stream with no "error" line (and
# therefore no rule match at all) makes ndjson unwrapping report "found
# nothing," so normalize() falls back to scanning the raw NDJSON text
# line-by-line, same as before this adapter had an envelope at all.
[envelope]
kind = "ndjson"
match_field = "type"

[[envelope.rules]]
type = "error"
field = "error.data.message"

# §12.2: opencode declares no readonly_argv, so it runs under OS-level
# confinement and must be told where its own configuration and credentials
# live -- a sandbox missing a credential path does not fail loudly, it makes
# the CLI look like a broken friend. Paths are the documented XDG locations
# plus opencode's own directories; a path that does not exist on a given
# machine is simply not bound (see sandbox.linux_argv on --ro-bind-try).
[sandbox]
read = [
  "~/.config/opencode",
  "~/.local/share/opencode",
  "~/.local/state/opencode",
  "~/.cache/opencode",
  "~/.opencode",
  "~/.npm",
  "~/.bun",
  "~/.config/node",
]

# §12.2: opencode runs confined, so it receives an allowlisted environment
# rather than the operator's whole shell. These are the variables it may
# legitimately need -- its own provider credentials, which §12.3 already
# accepts a friend can exfiltrate. Everything else is withheld, including
# every OTHER service's token.
#
# Deliberately not exhaustive: guessing at a long list would re-open the hole
# it exists to close. An operator whose setup needs one more can pass
# --pass-env VAR, and the run records how many were withheld.
[env]
pass = [
  "OPENCODE_CONFIG",
  "OPENCODE_CONFIG_DIR",
  "OPENAI_API_KEY",
  "ANTHROPIC_API_KEY",
  "OPENROUTER_API_KEY",
  "GROQ_API_KEY",
]
